<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>实时字幕测试页</title>
<style>
  html,body{height:100%;margin:0}
  body{background:#101014;color:#eee;font-family:"Microsoft YaHei",sans-serif;
       display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
  h1{font-size:44px;margin:0;letter-spacing:2px}
  p{color:#8a8a96;margin:0}
</style></head>
<body onclick="play()">
  <h1>实时字幕测试页</h1>
  <p>点击页面任意处开始播放（有声音）→ 再按 Alt+Shift+S 开启字幕</p>
  <audio id="a" src="tts.wav" loop></audio>
  <script>
    const a = document.getElementById('a');
    function play(){ a.play().catch(()=>{}); }
    setTimeout(play, 300);           // 首次可能被自动播放策略拦下，点一下页面即可
    setInterval(() => { if (a.paused) play(); }, 3000);
  </script>
</body>
</html>
