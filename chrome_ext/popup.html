<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; width: 272px; padding: 14px; background: #1b1d21; color: #e8eaed;
         font: 13px/1.5 "Microsoft YaHei", "PingFang SC", sans-serif; }
  h1 { margin: 0 0 2px; font-size: 14px; font-weight: 600; }
  .sub { margin: 0 0 12px; font-size: 11px; color: #9aa0a6; }
  label { display: flex; align-items: center; justify-content: space-between;
          gap: 8px; margin-bottom: 8px; }
  select { flex: 0 0 134px; padding: 5px 6px; border-radius: 6px; border: 1px solid #3c4043;
           background: #2a2d31; color: #e8eaed; font: inherit; }
  .hint { margin: 0 0 10px; padding: 7px 9px; border-radius: 6px; background: #23262a;
          color: #9aa0a6; font-size: 11px; line-height: 1.45; }
  button { width: 100%; padding: 9px 0; border: 0; border-radius: 8px; cursor: pointer;
           background: #1a73e8; color: #fff;
           font: 600 13px/1 "Microsoft YaHei", sans-serif; }
  button.on { background: #3c4043; }
  button:disabled { opacity: .55; cursor: default; }
  .state { margin: 9px 0 0; min-height: 15px; font-size: 11px; color: #9aa0a6;
           text-align: center; }
  .warn { color: #f28b82; }
</style>
</head>
<body>
  <h1>实时字幕翻译</h1>
  <p class="sub">本地推理，音频不上传云端</p>

  <label>视频语种
    <select id="lang">
      <option value="auto">自动识别</option>
      <option value="zh">中文</option>
      <option value="en">英语</option>
      <option value="ja">日语</option>
      <option value="ko">韩语</option>
    </select>
  </label>

  <p class="hint" id="hint"></p>

  <button id="btn">开始字幕</button>
  <p class="state" id="state">未连接</p>

  <script src="popup.js"></script>
</body>
</html>
